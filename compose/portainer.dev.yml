# Dev Portainer CE + Agent — auto admin + Docker via agent (not host socket / not Podman).
# Login: admin / tabasamu-dev  (see portainer-dev-admin.password)
# Reset broken setup: yarn portainer:reset
# Start only: yarn docker:compose up -d portainer-agent portainer

services:
  portainer-agent:
    image: portainer/agent:2.27.9
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      AGENT_CLUSTER_ADDR: portainer-agent

  portainer:
    image: portainer/portainer-ce:2.27.9
    restart: unless-stopped
    depends_on:
      - portainer-agent
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - portainer_data:/data
      - ./portainer-dev-admin.password:/tmp/portainer-admin.password:ro
    command:
      - --admin-password-file=/tmp/portainer-admin.password
      - -H
      - tcp://portainer-agent:9001
      - --tlsskipverify

volumes:
  portainer_data:
