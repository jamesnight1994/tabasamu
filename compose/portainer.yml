# Shared Portainer CE + Agent — included by docker-compose.prod.yml.
# UI: https://localhost:9443 (or http://localhost:9000)
# First visit: create admin user. Agent talks to Docker; Portainer never mounts the socket.

services:
  portainer-agent:
    container_name: tabasamu-prod-portainer-agent
    image: portainer/agent:2.27.9
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      AGENT_CLUSTER_ADDR: portainer-agent

  portainer:
    container_name: tabasamu-prod-portainer
    image: portainer/portainer-ce:2.27.9
    restart: unless-stopped
    depends_on:
      - portainer-agent
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - portainer_data:/data
    command:
      - -H
      - tcp://portainer-agent:9001
      - --tlsskipverify

volumes:
  portainer_data:
