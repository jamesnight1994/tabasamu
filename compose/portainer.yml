# Shared Portainer CE service — included by docker-compose.dev.yml and docker-compose.prod.yml.
# UI: https://localhost:9443 (or http://localhost:9000)
# First visit: create admin user. Stack env vars = secrets in Portainer CE.

services:
  portainer:
    image: portainer/portainer-ce:2.27.9
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
