# Lean local development — Nest API + Postgres + Next storefront (no Medusa).
#
# Usage:
#   yarn docker:dev                 # start (reuse images)
#   yarn docker:dev --build         # rebuild images then start
#   yarn docker:dev restart app     # restart storefront only
#   yarn docker:dev restart api     # restart Nest only
#   yarn docker:dev logs app        # follow storefront logs
#   yarn docker:dev down            # stop containers
#
# Storefront: http://localhost:3000  (ADAPTERS=http → Nest)
# Nest API:   http://localhost:3001/v1/products
# Postgres:   localhost:5437  (db/user/pass: tabasamu)
# If host :5437 is busy: TABASAMU_PG_HOST_PORT=5438 yarn docker:dev
#
# If host :3001 is busy: NEST_HOST_PORT=3011 yarn docker:dev
#
# Stop Medusa stack first if port 3000 clashes:
#   docker compose down
#
# Frontend Docker build runs `yarn install --immutable`. Keep frontend/yarn.lock
# in sync after package.json changes: cd frontend && yarn install
#
# Stale app named volume after dep changes: docker compose -f docker-compose.dev.yml down -v
# (also drops Postgres data — re-seed if needed)
#
# Portainer GUI: https://localhost:9443 — manages this stack + any other containers on the host.

name: tabasamu-dev

include:
  - path: compose/portainer.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabasamu
      POSTGRES_USER: tabasamu
      POSTGRES_PASSWORD: tabasamu
    # Host 5437 — avoid local Postgres (5432), Medusa Compose (5434), and other stacks.
    ports:
      - "${TABASAMU_PG_HOST_PORT:-5437}:5432"
    volumes:
      - tabasamu_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabasamu -d tabasamu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: development
    ports:
      - "${NEST_HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://tabasamu:tabasamu@postgres:5432/tabasamu?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Keep image node_modules; only sync source + prisma for hot reload.
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  app:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_ADAPTERS: http
      # Browser → host-mapped Nest port
      NEXT_PUBLIC_API_URL: http://localhost:${NEST_HOST_PORT:-3001}
      # Next server components → Compose network
      NEST_API_URL: http://api:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - app_dev_node_modules:/app/node_modules
      - app_dev_next:/app/.next
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  tabasamu_dev_postgres:
  app_dev_node_modules:
  app_dev_next:
