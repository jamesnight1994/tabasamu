# Production-style container (standalone Next.js server in front-end/).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# App: http://localhost:3000

services:
  app:
    build:
      context: ./front-end
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ADAPTERS: ${NEXT_PUBLIC_ADAPTERS:-mock}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
        NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    env_file:
      - path: front-end/.env.example
        required: false
      - path: front-end/.env.local
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
