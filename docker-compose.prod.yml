# Production-style stack — Nest API + Postgres + Next storefront (`frontend/`).
#
# Usage:
#   yarn docker:compose --prod up -d --build
#
# Config is runtime (TABASAMU_* / ADMIN_API_KEY). After editing env in Portainer
# or `/opt/tabasamu/.env`, Recreate the container — no rebuild for config-only changes.
#
# Storefront / admin: http://localhost:3000
# Nest API:           http://localhost:3001/v1/products  · Swagger /docs
# Postgres:           localhost:5436  (db/user/pass: tabasamu)
# Portainer:          https://localhost:9443

name: tabasamu-prod

include:
  - path: compose/portainer.yml

services:
  postgres:
    container_name: tabasamu-prod-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabasamu
      POSTGRES_USER: tabasamu
      POSTGRES_PASSWORD: tabasamu
    ports:
      - "5436:5432"
    volumes:
      - tabasamu_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabasamu -d tabasamu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    container_name: tabasamu-prod-backend-api
    build:
      context: ./backend
      target: runner
    ports:
      - "${NEST_HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://tabasamu:tabasamu@postgres:5432/tabasamu?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: tabasamu-prod-frontend
    build:
      context: ./frontend
      target: runner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Runtime public config (entrypoint → /runtime-env.js). Portainer-updatable.
      TABASAMU_APP_ENV: ${TABASAMU_APP_ENV:-staging}
      TABASAMU_PUBLIC_APP_URL: ${TABASAMU_PUBLIC_APP_URL:-http://localhost:3000}
      TABASAMU_PUBLIC_API_URL: ${TABASAMU_PUBLIC_API_URL:-http://localhost:3001}
      TABASAMU_ADAPTERS: ${TABASAMU_ADAPTERS:-http}
      TABASAMU_ANALYTICS_ENABLED: ${TABASAMU_ANALYTICS_ENABLED:-false}
      TABASAMU_LOG_LEVEL: ${TABASAMU_LOG_LEVEL:-info}
      # Server-only — admin BFF injects X-Admin-Api-Key
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      NEST_API_URL: http://backend-api:3001
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  tabasamu_prod_postgres:
