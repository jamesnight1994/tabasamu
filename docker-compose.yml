# Local development — hot reload with bind-mounted source.
#
# Usage:
#   cp .env.example .env.local   # once
#   docker compose up --build
#
# App: http://localhost:3000

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file:
      - path: .env.example
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Ensure browser-facing URLs work from the host machine
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_ADAPTERS: ${NEXT_PUBLIC_ADAPTERS:-mock}
      # Reliable file watching when the Docker FS is slower (Linux/WSL/macOS)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # Keep container node_modules / .next out of the host bind mount
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    stdin_open: true
    tty: true

volumes:
  app_node_modules:
  app_next:
