# Local development — Next.js storefront + Medusa v2
#
# Usage:
#   cp .env.example .env.local
#   cp commerce/apps/backend/.env.example commerce/apps/backend/.env
#   docker compose up --build
#
# Storefront: http://localhost:3000
# Medusa API / Admin: http://localhost:9000  (Admin UI typically /app)
#
# Default NEXT_PUBLIC_ADAPTERS=mock (design work without Medusa).
# Set NEXT_PUBLIC_ADAPTERS=http after seeding and copying the publishable key.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    # Host 5434 — avoid clash with local Postgres on 5432 (and other stacks on 5433).
    # Inside the Compose network Medusa still uses postgres:5432.
    ports:
      - "5434:5432"
    volumes:
      - medusa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host 6382 — avoid clash with local Redis (6379) and other Compose stacks (6380).
    # Inside the Compose network Medusa still uses redis://redis:6379.
    ports:
      - "6382:6379"
    volumes:
      - medusa_redis:/data

  medusa:
    build:
      context: ./commerce
      dockerfile: apps/backend/Dockerfile
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_change_me}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret_cookie_change_me}
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://localhost:5173
      AUTH_CORS: http://localhost:9000,http://localhost:3000,http://localhost:5173
      PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./commerce/apps/backend/src:/workspace/apps/backend/src
      - ./commerce/apps/backend/medusa-config.ts:/workspace/apps/backend/medusa-config.ts

  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file:
      - path: .env.example
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      # Prefer .env.local via env_file for ADAPTERS / API URL / publishable key.
      # Do not set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY here — an empty ${VAR:-}
      # would override env_file and break Medusa Store API calls.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://medusa:9000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      - medusa
    stdin_open: true
    tty: true

volumes:
  app_node_modules:
  app_next:
  medusa_postgres:
  medusa_redis:
