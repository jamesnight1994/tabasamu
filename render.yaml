# Render Blueprint — Medusa backend for Tabasamu (storefront stays on Vercel).
# Postgres + Key Value may already exist; this documents the web service wiring.
# Prefer linking DATABASE_URL / REDIS_URL from the dashboard if services pre-exist.

services:
  - type: web
    name: tabasamu-medusa
    runtime: node
    plan: free
    region: oregon
    branch: dev
    autoDeploy: true
    # Ideal buildCommand (set in dashboard / Blueprint sync) — build phase has more RAM than start.
    # Live dashboard may still be install-only; apps/backend postinstall then builds when RENDER=true.
    # Start: migrate + serve from .medusa/server only (no medusa build — avoids free-tier OOM).
    # npm is intentional for .medusa/server: Medusa generates a standalone npm package.
    # Free tier: DISABLE_MEDUSA_ADMIN=true keeps the compile smaller.
    buildCommand: set -euxo pipefail; corepack enable; corepack prepare yarn@4.10.3 --activate; cd commerce; yarn install --immutable --network-timeout 600000; cd apps/backend; yarn build; cd .medusa/server; npm install --omit=dev
    # Prefer .medusa/server start; yarn start:prod also cds there (works with older dashboard start).
    startCommand: cd commerce/apps/backend/.medusa/server && npm run predeploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Raise V8 heap for medusa build on small instances (default ~256MB OOMs).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      # Single free-tier instance: shared server+worker; admin off to fit memory.
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: DISABLE_MEDUSA_ADMIN
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: ADMIN_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:9000,http://localhost:3000
      - key: AUTH_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: tabasamu-medusa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tabasamu-medusa-redis
          type: keyvalue
          property: connectionString
