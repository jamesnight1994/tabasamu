# Render Blueprint — Medusa backend for Tabasamu (storefront stays on Vercel).
# Postgres + Key Value may already exist; this documents the web service wiring.
# Prefer linking DATABASE_URL / REDIS_URL from the dashboard if services pre-exist.

services:
  - type: web
    name: tabasamu-medusa
    runtime: node
    plan: free
    region: oregon
    branch: dev
    autoDeploy: true
    # Install + compile during build so start only migrates and serves (avoids OOM on free plan).
    buildCommand: set -euxo pipefail; corepack enable; corepack prepare yarn@4.10.3 --activate; cd commerce; yarn install --immutable --network-timeout 600000; cd apps/backend; yarn build
    startCommand: cd commerce/apps/backend && yarn start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Raise V8 heap for medusa build / start on small instances (default ~256MB OOMs).
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: ADMIN_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:9000,http://localhost:3000
      - key: AUTH_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: tabasamu-medusa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tabasamu-medusa-redis
          type: keyvalue
          property: connectionString
