# Render Blueprint — Medusa backend for Tabasamu (storefront stays on Vercel).
# Deploy path: build image locally (scripts/deploy-medusa-image.sh) → GHCR → this image service.
# Postgres + Key Value may already exist; link DATABASE_URL / REDIS_URL from the dashboard if needed.
#
# One-time dashboard setup:
#   1. Add GHCR registry credential (name: ghcr-tabasamu) with a PAT that has read:packages
#   2. Ensure this service is image-backed (not Node git build)
#   3. Copy Deploy Hook into RENDER_DEPLOY_HOOK_URL for the local script

services:
  - type: web
    name: tabasamu-medusa
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/jamesnight1994/tabasamu-medusa:dev
      creds:
        fromRegistryCreds:
          name: ghcr-tabasamu
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: DISABLE_MEDUSA_ADMIN
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: ADMIN_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:9000,http://localhost:3000
      - key: AUTH_CORS
        value: https://tabasamu-git-dev-jamesnight1994s-projects.vercel.app,https://tabasamu-delta.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: tabasamu-medusa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tabasamu-medusa-redis
          type: keyvalue
          property: connectionString
